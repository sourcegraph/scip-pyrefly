name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3, without v prefix)"
        required: true
        type: string
  # scheduled-release.yml calls this every 4 weeks.
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: version '$NEW_VERSION' does not match semantic versioning (expected X.Y.Z)"
            exit 1
          fi

      - name: Create and push tag
        env:
          NEW_VERSION: ${{ inputs.version }}
        # A rerun after a later job failed finds its own tag.
        run: |
          if [ "$(git rev-parse -q --verify "refs/tags/v$NEW_VERSION^{commit}" || true)" != "$GITHUB_SHA" ]; then
            git tag "v$NEW_VERSION"
            git push origin "v$NEW_VERSION"
          fi

  create-release:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "scip-pyrefly $TAG" --generate-notes --draft --verify-tag

  docker:
    needs: create-release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: nix build .#docker

      - name: Load and push arch-specific image
        run: |
          set -eux
          docker load < result
          ARCH_TAG="ghcr.io/sourcegraph/scip-pyrefly:v${{ inputs.version }}-${{ matrix.arch }}"
          docker tag scip-pyrefly:latest "$ARCH_TAG"
          docker push "$ARCH_TAG"

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          set -eux
          VERSION="${{ inputs.version }}"
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          AMD64="ghcr.io/sourcegraph/scip-pyrefly:v${VERSION}-amd64"
          ARM64="ghcr.io/sourcegraph/scip-pyrefly:v${VERSION}-arm64"
          for TAG in "v$VERSION" "v$MAJOR" "v$MINOR" "latest"; do
            docker manifest create "ghcr.io/sourcegraph/scip-pyrefly:$TAG" "$AMD64" "$ARM64"
            docker manifest push "ghcr.io/sourcegraph/scip-pyrefly:$TAG"
          done

  publish-release:
    needs: docker-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" --repo "${{ github.repository }}" --draft=false
